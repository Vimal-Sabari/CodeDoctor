# LaunchForge AI — QLoRA Training Configuration (RTX 5050 8GB VRAM, WSL2)

model_name: "Qwen/Qwen3-4B-Instruct-2507"
fallback_model_name: "Qwen/Qwen2.5-Coder-3B-Instruct"
run_name: "qwen3_4b_qlora_v1"

train_chat_jsonl: "data/processed/train_chat.jsonl"
val_chat_jsonl: "data/processed/val_chat.jsonl"
adapters_dir: "models/adapters"
merged_dir: "models/merged"
reports_dir: "reports"
seed: 42

quantization:
  load_in_4bit: true
  quant_type: "nf4"
  use_double_quant: true
  compute_dtype: "bfloat16"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  use_unsloth: true
  max_seq_length: 3072
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.5e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  num_train_epochs: 3
  optim: "paged_adamw_8bit"
  gradient_checkpointing: true
  packing: false
  eval_steps: 50
  save_steps: 50
  logging_steps: 10
  early_stopping_patience: 3
  dry_run_max_steps: 10
  dry_run_max_examples: 20
  wandb_enabled: false
  wandb_project: "launchforge-ai"

merge:
  torch_dtype: "bfloat16"
  max_shard_size: "2GB"
