[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "launchforge-ai"
version = "0.1.0"
description = "Locally hosted, fine-tuned LLM + hybrid RAG for frontend build failure root-cause analysis."
readme = "docs/SETUP.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "psutil>=5.9.8",
]

[project.optional-dependencies]
train = [
    "transformers>=4.46.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "peft>=0.13.0",
    "trl>=0.11.0",
    "bitsandbytes>=0.45.0",
    "unsloth",
]
rag = [
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "httpx>=0.27.0",
]
preprocess = [
    "detect-secrets>=1.5.0",
    "datasketch>=1.6.5",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
all = [
    "launchforge-ai[train,rag,preprocess,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
