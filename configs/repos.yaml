    url: https://github.com/vitejs/vite.git
    subdir: packages/create-vite/template-react-ts
    commit: VERIFY_SHA
    framework: vite-react
    package_manager: npm
    node_version: "20"
    install_cmd: "npm install"
    build_cmd: "npm run build"
    verified: false
    notes: "Verify latest main SHA and that template-react-ts builds standalone."

